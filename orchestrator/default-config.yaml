database_path: /var/lib/runner-orchestrator/state.db
log_level: INFO
shadow_mode: true
drain: false

github:
  app_id: ""
  private_key_file: /run/credentials/github_app_private_key
  webhook_secret_file: /run/credentials/github_webhook_secret
  api_url: https://api.github.com
  api_version: "2022-11-28"
  installations:
    # Live override maps this key to the acme personal installation.
    acme-app:
      account: acme
      installation_id: 1234567
      scope: repository
      runner_group_id: 1
    # Adicione a instalação da organização quando os IDs forem conhecidos:
    # minha-org:
    #   account: NomeDaOrganizacao
    #   installation_id: 000000000
    #   scope: organization
    #   runner_group_id: 2

proxmox:
  endpoint: https://pve.example.internal
  api_token_file: /run/credentials/proxmox_api_token
  node: pve
  template_vmid: 9101
  storage: local-lvm
  bridge: vci
  gateway: 10.0.0.1
  vmid_start: 5000
  vmid_end: 5099
  ip_start: 100
  ip_end: 199
  verify_tls: true

broker:
  host: 10.0.1.5
  user: runner-broker
  key_file: /run/credentials/runner_broker_ssh_key
  known_hosts_file: /etc/runner-orchestrator/ssh_known_hosts

cache:
  root: /srv/runner-cache
  mount_path: /cache
  # Usage/quota (80% / 40GiB per repo) is enforced on the Proxmox node by
  # runner-ct-broker.sh (RUNNER_CACHE_MAX_PERCENT / RUNNER_CACHE_QUOTA_GB),
  # not by the orchestrator — there's no field here for it.
  # Automatic GC is disabled: every reconciliation would open an SSH broker
  # session on the Proxmox host. Run GC from the dashboard during maintenance.
  gc_orphan_days: 0

capacity:
  # Global ceiling for non-idle-pool runners (warms + jobs). Must be >= sum of
  # repository warm_capacity. Dashboard can raise this without redeploy.
  max_active: 4
  pool_size: 1
  ready_timeout_seconds: 300
  max_job_seconds: 10800
  persistent_idle_seconds: 86400
  reconcile_seconds: 60
  # Warm recycle-in-place (re-JIT without clone). Exceeding forces destroy+reclone.
  warm_max_uses: 25
  warm_max_age_seconds: 14400
  warm_destroy_on_failure: true
  warm_min_root_mib: 2048
  # Wall clock one reconcile pass may spend before deferring the rest to the
  # next one. Bounds how long a dead dependency can stall the loop; must be
  # >= 30 and comfortably above one worst-case container teardown.
  reconcile_budget_seconds: 45
  # Retire idle pool containers past this age (0 disables). A week-old clone of
  # a golden template that has since been rebuilt is not what you think it is.
  pool_max_age_seconds: 86400
  # How often to probe GitHub/Proxmox/broker out of band. This runs on its
  # own task: during the thin-pool exhaustion incident the reconcile loop was the only
  # thing touching GitHub, so when it stalled nothing was left to notice why.
  dependency_probe_seconds: 30

# Admission control against the storage runners clone into. `max_active` is a
# count, not a budget: without this section nothing connects "11 active
# runners" to "11 x rootfs_gb of thin pool", which is how a pool shared with
# other production workloads reached 91% unnoticed.
storage:
  guard_enabled: true
  # Hard floor. Below either of these, speculative replenishment is refused;
  # real queued jobs are requeued (never failed) until space returns.
  min_free_gb: 100
  max_used_percent: 80.0
  # Soft floor: still allowed, but alerted on.
  warn_free_gb: 150
  poll_seconds: 60
  # Your declared share of a shared pool. 0 = report projected demand at
  # startup but do not enforce it.
  #
  # Leave this at 0 unless you know you want the worst case enforced. Projected
  # demand is computed as max_active x rootfs_gb, i.e. every container filling
  # its whole root filesystem. Thin provisioning means real usage is far lower:
  # measured on a live cluster, a warm runner occupied roughly a quarter of
  # its provisioned rootfs. So `max_active: 11` with `rootfs_gb: 25` projects
  # 275 GiB but costs nearer 65 GiB in practice.
  #
  # The protection that actually matters for a shared pool is min_free_gb /
  # max_used_percent below, which act on the real reading. Set total_budget_gb
  # only if you want a hard config-time ceiling on the worst case as well.
  total_budget_gb: 0
  # If the storage reading itself fails, allow clones rather than halting CI.
  fail_open: true

# Protection for POST/PUT /api/v1/admin/*. Without a token these routes are
# open to anything that can reach the port — drain, policy rewrite, cache
# purge, container destroy.
api:
  # Provide via a systemd credential, e.g.
  #   LoadCredential=runner_orchestrator_admin_token:/etc/runner-orchestrator/admin-token
  admin_token_file: ""
  # Leave true only while migrating; the dashboard shows a standing alert while
  # it is. Set false once a token is provisioned.
  allow_unauthenticated_admin: true

profiles:
  crossbuild-small:
    cores: 6
    memory_mb: 4096
    swap_mb: 2048
    rootfs_gb: 25

repositories:
  acme/example-app:
    github_installation: acme-app
    default_mode: ephemeral
    warm_capacity: 1
    # Elastic warm pool (opt-in, disabled by default): scale warm_capacity
    # down to warm_idle_capacity after warm_idle_after_seconds with no job
    # request for this repo, then back up to warm_capacity on the next one.
    # warm_idle_capacity: 0
    # warm_idle_after_seconds: 21600
    allowed_modes: [ephemeral, pool, persistent]
    allowed_events: [push, workflow_dispatch, schedule]
    required_labels: [self-hosted, proxmox-lxc, crossbuild]
  acme/example-service:
    github_installation: acme-app
    # Dedicated warm reserve (2); claim path is mode-ephemeral.
    default_mode: ephemeral
    warm_capacity: 2
    allowed_modes: [ephemeral, pool, persistent]
    allowed_events: [push, workflow_dispatch, schedule]
    required_labels: [self-hosted, proxmox-lxc, crossbuild]

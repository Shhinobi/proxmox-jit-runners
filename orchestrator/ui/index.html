<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orchestra — Proxmox Runner Orchestrator</title>
<!-- Same mark, no container. The fill is a mid accent rather than the UI token
     so it stays legible against both a light and a dark browser tab bar. -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><g fill='%233AAFC8'><path d='M5,72 C20,34 56,12 96,32 C62,26 27,54 5,72 Z'/><circle cx='26' cy='86' r='6'/><circle cx='53' cy='79' r='7.2'/><circle cx='81' cy='69' r='8.4'/></g></svg>">
<!-- Discovered only after tokens.css parses otherwise, which is a second
     round-trip before any text is drawn. `crossorigin` is required even
     same-origin: font fetches are always CORS-mode, and without it the
     preloaded file is fetched a second time instead of being reused.
     These paths deliberately stay unversioned so they match the `url()` in
     tokens.css exactly — asset_version() only rewrites css/js/vendor. -->
<link rel="preload" href="fonts/ibm-plex-sans-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/ibm-plex-mono-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
<script>
  /* Paint the chosen theme before first paint so there is no flash. */
  (function () {
    var t = localStorage.getItem("ro-theme");
    if (t && t !== "auto") document.documentElement.setAttribute("data-theme", t);
  })();
</script>
</head>
<body>

<div class="app" x-data="dashboard" x-cloak
     :class="{ 'is-reconnecting': connection === 'reconnecting' }">

  <!-- ══════════════════════════════════════════════════════════════ rail ══ -->
  <aside class="rail">
    <a class="brand" href="#/overview" aria-label="Orchestra, overview">
      <!-- The mark is a phrase slur drawn as one brush stroke — hairline at the
           left, swelling to a blade as it accelerates right — held over three
           staccato voices. One gesture governing several short-lived notes is
           what this service does; the notation says it without a diagram. -->
      <svg class="brand__mark" width="32" height="32" viewBox="0 0 100 100" aria-hidden="true">
        <path d="M5,72 C20,34 56,12 96,32 C62,26 27,54 5,72 Z" fill="var(--accent)"/>
        <g class="glyph" fill="var(--accent)">
          <circle cx="26" cy="86" r="6"/>
          <circle cx="53" cy="79" r="7.2"/>
          <circle cx="81" cy="69" r="8.4"/>
        </g>
      </svg>
      <span class="brand__text">
        <span class="brand__word">Orchestra</span><br>
        <span class="brand__sub">Proxmox Runner Orchestrator</span>
      </span>
    </a>

    <nav class="nav" aria-label="Primary">
      <template x-for="item in [
          {id:'overview', label:'Overview'},
          {id:'runners',  label:'Runners'},
          {id:'jobs',     label:'Jobs'},
          {id:'webhooks', label:'Webhooks'}
        ]" :key="item.id">
        <a class="nav__item" :href="'#/' + item.id"
           :aria-current="route === item.id ? 'page' : false">
          <span x-text="item.label"></span>
          <template x-if="item.id === 'runners' && failedCount">
            <span class="nav__count is-bad num" x-text="failedCount"></span>
          </template>
        </a>
      </template>

      <hr style="border:none;border-top:1px solid var(--hairline);margin:var(--s-2) var(--s-3)">

      <template x-for="item in [
          {id:'capacity',     label:'Capacity'},
          {id:'dependencies', label:'Health'},
          {id:'drift',        label:'Drift'},
          {id:'logs',         label:'Logs'},
          {id:'cache',        label:'Cache'},
          {id:'policies',     label:'Policies'}
        ]" :key="item.id">
        <a class="nav__item" :href="'#/' + item.id"
           :aria-current="route === item.id ? 'page' : false">
          <span x-text="item.label"></span>
          <template x-if="item.id === 'drift' && driftCount">
            <span class="nav__count num" x-text="driftCount"></span>
          </template>
        </a>
      </template>
    </nav>

    <!-- Dependency state lives in the rail on purpose: the failure class that
         caused the thin-pool exhaustion incident must be visible from every page. -->
    <div class="rail__system">
      <p class="eyebrow" style="padding:0 var(--s-3) var(--s-1)">Dependencies</p>
      <div class="deps">
        <template x-for="d in deps" :key="d.name">
          <a class="dep" href="#/dependencies" :title="d.label + ': ' + d.detail">
            <span class="dep__dot"
                  :class="d.unknown ? 'is-warn' : (d.up ? 'is-up' : 'is-down')"></span>
            <span class="dep__label" x-text="d.label"></span>
            <span class="dep__lat" x-text="d.detail"></span>
          </a>
        </template>
      </div>
      <div class="rail__node">
        <span class="mono" x-text="overview.proxmox?.node ?? '—'"></span>
        <span class="mono" x-text="overview.status ?? ''"></span>
      </div>
    </div>
  </aside>

  <!-- ══════════════════════════════════════════════════════════════ main ══ -->
  <main class="main">

    <header class="topbar">
      <div>
        <h1 class="topbar__title" x-text="{
          overview:'Overview', runners:'Runners', jobs:'Jobs', webhooks:'Webhook deliveries',
          capacity:'Capacity &amp; storage', dependencies:'Dependency health', drift:'Drift',
          logs:'Logs', cache:'Build cache', policies:'Policies'
        }[route] ?? 'Overview'" x-show="!needsSetup"></h1>
        <h1 class="topbar__title" x-show="needsSetup" x-cloak>First-run setup</h1>
        <p class="topbar__sub">
          <span x-text="overview.proxmox?.node ?? ''"></span>
          <template x-if="overview.reconcile?.last_success_age_seconds != null">
            <span>
              · reconciled
              <span x-text="fmt.age(overview.reconcile.last_success_age_seconds)"></span> ago
            </span>
          </template>
        </p>
      </div>

      <div class="topbar__spacer"></div>

      <div class="topbar__actions">
        <button class="btn btn--ghost" @click="openPalette()">
          <span>Search</span><span class="kbd">⌘K</span>
        </button>
        <template x-if="overview.admin_auth?.claimed">
          <!-- The outside-click handler belongs on the wrapper: on the menu itself,
                 the click that opens it already counts as "outside" and closes it
                 again in the same gesture. -->
            <div class="lock" @keydown.escape="lockMenu = false"
                 @click.outside="lockMenu = false">
            <button class="btn btn--ghost lock__btn" :class="{ 'is-unlocked': isUnlocked }"
                    @click="isUnlocked ? (lockMenu = !lockMenu) : openUnlock()"
                    :aria-expanded="isUnlocked ? lockMenu : false"
                    :title="isUnlocked
                      ? (stayUnlocked ? 'Unlocked on this device' : 'Unlocked for this tab')
                      : 'Unlock to make changes'">
              <svg width="12" height="14" viewBox="0 0 12 14" aria-hidden="true"
                   fill="none" stroke="currentColor" stroke-width="1.4">
                <rect x="1.2" y="6" width="9.6" height="7" rx="1.6"/>
                <path :d="isUnlocked ? 'M3.6 6V3.8a2.4 2.4 0 0 1 4.6-.9' : 'M3.6 6V3.8a2.4 2.4 0 0 1 4.8 0V6'"/>
              </svg>
              <span x-text="isUnlocked ? 'Unlocked' : 'Locked'"></span>
            </button>
            <template x-if="lockMenu">
              <div class="lock__menu">
                <p class="lock__note"
                   x-text="stayUnlocked
                     ? 'Unlocked on this device until you lock it again.'
                     : 'Unlocked for this tab. Closing it locks again.'"></p>
                <button class="lock__item" @click="openPasswordChange()">Change password…</button>
                <button class="lock__item" @click="lock()">Lock now</button>
              </div>
            </template>
          </div>
        </template>
        <button class="btn btn--ghost" @click="cycleTheme()"
                :aria-label="'Theme: ' + theme" :title="'Theme: ' + theme">
          <span x-text="themeGlyph" aria-hidden="true"></span>
        </button>
        <span class="conn" :class="{ 'is-stale': isStale }"
              :title="staleSeconds != null ? `last update ${staleSeconds}s ago` : ''">
          <span class="conn__dot"></span>
          <span x-text="connection === 'live' && !isStale
                        ? 'live'
                        : (staleSeconds != null ? `stale ${staleSeconds}s` : connection)"></span>
        </span>
      </div>
    </header>

    <!-- ───────────────────────────────────────────────────── first run ── -->
    <template x-if="snap && needsSetup">
      <div class="page">
        <section class="panel setup">
          <header class="panel__head">
            <h2 class="panel__title">Secure this instance</h2>
            <span class="panel__meta"
                  x-text="setup.can_claim
                    ? `setup open for ${fmt.age(setup.claim_window_seconds)}`
                    : 'setup window closed'"></span>
          </header>
          <div class="panel__body">
            <p class="meter__note" style="max-width:60ch">
              Anything that can reach this port can currently drain the cluster,
              rewrite repository policy or destroy a container. Set an admin
              password and those actions stay locked until it is entered. Nothing
              is written to the host and nothing needs restarting.
            </p>

            <template x-if="setup.can_claim">
              <form class="setup__form" @submit.prevent="claimInstance()">
                <div class="field" style="max-width:24rem">
                  <label class="field__label" for="setup-pw">Admin password</label>
                  <input id="setup-pw" class="input" type="password" autocomplete="new-password"
                         minlength="12" x-model="setupForm.password"
                         placeholder="at least 12 characters">
                </div>
                <div class="field" style="max-width:24rem">
                  <label class="field__label" for="setup-pw2">Confirm</label>
                  <input id="setup-pw2" class="input" type="password" autocomplete="new-password"
                         x-model="setupForm.confirm">
                </div>
                <button class="btn btn--primary" type="submit"
                        :disabled="setupForm.password.length < 12
                                   || setupForm.password !== setupForm.confirm">
                  Set password
                </button>
                <p class="meter__note"
                   x-show="setupForm.confirm && setupForm.password !== setupForm.confirm"
                   style="color:var(--warn)">The two entries do not match.</p>
              </form>
            </template>

            <template x-if="!setup.can_claim">
              <p class="well">
                The first-run window has closed. Restart the service to reopen it —
                that requires access to the host, which is the point: it stops an
                instance left running from being adopted by whoever finds it.
              </p>
            </template>
          </div>
        </section>
      </div>
    </template>

    <!-- ─────────────────────────────────────────────────────── loading ── -->
    <template x-if="!snap">
      <div class="page">
        <section class="meters">
          <template x-for="i in 6" :key="i">
            <article class="meter">
              <span class="skel" style="display:block;height:11px;width:60%"></span>
              <span class="skel" style="display:block;height:24px;width:40%"></span>
              <div class="meter__track"></div>
              <span class="skel" style="display:block;height:12px;width:75%"></span>
            </article>
          </template>
        </section>
      </div>
    </template>

    <!-- ═════════════════════════════════════════════════════════ OVERVIEW ══ -->
    <template x-if="snap && !needsSetup && route === 'overview'">
      <div class="page">
        <section class="meters" aria-label="Key metrics">
          <template x-for="m in meters" :key="m.label">
            <article class="meter" :class="{ 'is-critical': m.tone === 'bad' }">
              <p class="eyebrow" x-text="m.label"></p>
              <p class="meter__head">
                <span class="meter__value" x-text="m.value"></span>
                <template x-if="m.of !== null && m.of !== undefined">
                  <span class="meter__of" x-text="'/ ' + m.of"></span>
                </template>
              </p>
              <div class="meter__track">
                <div class="meter__fill" :class="'is-' + (m.tone || '')"
                     :style="`width:${(m.ratio*100).toFixed(1)}%`"></div>
                <template x-if="m.label === 'Thin pool'">
                  <div class="meter__mark" data-label="floor"
                       :style="`left:${(storage.floor_ratio ?? 0.8) * 100}%`"></div>
                </template>
              </div>
              <p class="meter__note" x-text="m.note"></p>
            </article>
          </template>
        </section>

        <template x-if="alerts.length">
          <section class="alerts" aria-label="Active alerts" aria-live="polite">
            <template x-for="a in alerts" :key="a.code">
              <div class="alert" :class="'is-' + a.severity">
                <span class="alert__glyph" aria-hidden="true"
                      x-text="a.severity === 'critical' ? '✕' : a.severity === 'warning' ? '⚠' : 'ℹ'"></span>
                <div class="alert__body">
                  <span class="alert__code" x-text="a.code"></span>
                  <p class="alert__msg" x-text="a.message"></p>
                </div>
              </div>
            </template>
          </section>
        </template>

        <template x-if="!alerts.length">
          <section class="panel">
            <div class="empty">
              <span class="empty__glyph" aria-hidden="true">●</span>
              <p>No active alerts. Everything is within policy.</p>
            </div>
          </section>
        </template>

        <div class="grid-2">
          <section class="panel">
            <header class="panel__head">
              <h2 class="panel__title"
                  x-text="`Thin pool — ${storage.storage ?? 'storage'}`"></h2>
              <a class="panel__meta" href="#/capacity">Details →</a>
            </header>
            <div class="panel__body">
              <template x-if="gauge">
                <div class="gauge">
                  <p class="gauge__head">
                    <span class="gauge__pct" x-text="fmt.pct(storage.used_ratio)"></span>
                    <span class="gauge__bytes"
                          x-text="`${fmt.gib(storage.used_bytes)} of ${fmt.gib(storage.total_bytes)} · ${fmt.gib(gauge.free)} free`"></span>
                  </p>
                  <div class="gauge__track">
                    <div class="gauge__seg is-runners" :class="{ 'is-bad': gauge.critical }"
                         :style="`left:0;width:${gauge.usedPct}%`"></div>
                    <div class="gauge__floor" data-label="floor"
                         :style="`left:${gauge.floorPct}%`"></div>
                  </div>
                  <p class="meter__note">
                    Replenishment is refused above the floor, so the orchestrator stops
                    before it can fill a pool it shares with other workloads.
                  </p>
                </div>
              </template>
              <template x-if="!gauge">
                <div class="empty">
                  <span class="empty__glyph" aria-hidden="true">○</span>
                  <p>Storage reading unavailable.</p>
                </div>
              </template>
            </div>
          </section>

          <section class="panel">
            <header class="panel__head">
              <h2 class="panel__title">Dependencies</h2>
              <a class="panel__meta" href="#/dependencies">Details →</a>
            </header>
            <div class="panel__body" style="display:flex;flex-direction:column;gap:var(--s-3)">
              <template x-for="d in deps" :key="d.name">
                <div style="display:flex;align-items:baseline;gap:var(--s-2)">
                  <span class="dep__dot"
                  :class="d.unknown ? 'is-warn' : (d.up ? 'is-up' : 'is-down')"></span>
                  <strong style="font-size:var(--fs-small)" x-text="d.label"></strong>
                  <span class="faint mono" style="font-size:var(--fs-micro);margin-left:auto"
                        x-text="d.detail"></span>
                </div>
              </template>
              <p class="meter__note">
                Probed independently of the reconcile loop, so a stalled pass can never
                hide a dead dependency.
              </p>
            </div>
          </section>
        </div>

        <section class="panel">
          <header class="panel__head">
            <h2 class="panel__title">Recent job timeline</h2>
            <span class="panel__meta">queued → provisioning → running</span>
          </header>
          <div class="panel__body">
            <template x-if="timelineRows(10).length">
              <div>
                <div class="timeline">
                  <template x-for="row in timelineRows(10)" :key="row.job.job_id">
                    <div class="tl-row">
                      <span class="tl-label">
                        <span class="mono" x-text="(row.job.repository || '').split('/')[1] || '—'"></span>
                        <template x-if="row.job.start_source">
                          <span class="faint" x-text="' · ' + row.job.start_source"></span>
                        </template>
                      </span>
                      <div class="tl-rail" :style="`width:${row.width}%`">
                        <template x-for="(s, i) in row.segs" :key="i">
                          <div class="tl-seg" :class="'p-' + s.phase" :style="`width:${s.pct}%`"
                               :title="`${s.phase}: ${s.seconds}s`"></div>
                        </template>
                      </div>
                      <span class="tl-dur" x-text="row.total + 's'"></span>
                    </div>
                  </template>
                </div>
                <div class="tl-legend" style="margin-top:var(--s-4)">
                  <template x-for="p in ['queued','provisioning','running','failed']" :key="p">
                    <span class="gauge__key">
                      <span class="gauge__swatch tl-seg" :class="'p-' + p"
                            style="display:inline-block"></span>
                      <span x-text="p"></span>
                    </span>
                  </template>
                </div>
              </div>
            </template>
            <template x-if="!timelineRows(10).length">
              <div class="empty">
                <span class="empty__glyph" aria-hidden="true">○</span>
                <p>No completed jobs yet.</p>
              </div>
            </template>
          </div>
        </section>
      </div>
    </template>

    <!-- ══════════════════════════════════════════════════════════ RUNNERS ══ -->
    <template x-if="snap && !needsSetup && route === 'runners'">
      <div class="page">
        <section class="panel">
          <div class="table-toolbar">
            <div class="field" style="flex:1;max-width:16rem">
              <label class="field__label" for="f-q">Search</label>
              <input id="f-q" class="input" type="search" placeholder="vmid, ip, runner, error…"
                     x-model="filters.q">
            </div>
            <div class="field">
              <label class="field__label" for="f-repo">Repository</label>
              <select id="f-repo" class="select" x-model="filters.repository">
                <option value="">any</option>
                <template x-for="r in repoOptions" :key="r">
                  <option :value="r" x-text="r"></option>
                </template>
              </select>
            </div>
            <div class="field">
              <label class="field__label" for="f-status">Status</label>
              <select id="f-status" class="select" x-model="filters.status">
                <option value="">any</option>
                <template x-for="s in ['ready','running','provisioning','delete_pending','deleting','delete_failed']" :key="s">
                  <option :value="s" x-text="s"></option>
                </template>
              </select>
            </div>
            <div class="field">
              <label class="field__label" for="f-mode">Mode</label>
              <select id="f-mode" class="select" x-model="filters.mode">
                <option value="">any</option>
                <template x-for="s in ['warm','pool','ephemeral','persistent']" :key="s">
                  <option :value="s" x-text="s"></option>
                </template>
              </select>
            </div>
            <div style="flex:1"></div>
            <button class="btn" :class="{ 'is-busy': busy === 'Reconcile' }"
                    :disabled="!canChange" :title="lockReason"
                    @click="adminAction('Reconcile', '/api/v1/admin/reconcile')">Reconcile</button>
            <button class="btn" :class="{ 'is-busy': busy === 'Recycle ready' }"
                    :disabled="!canChange" :title="lockReason"
                    @click="adminAction('Recycle ready', '/api/v1/admin/recycle-ready')">Recycle ready</button>
          </div>

          <div class="table-wrap">
            <table class="table">
              <thead>
                <tr>
                  <th>VMID</th><th>Address</th><th>Mode</th><th>Status</th>
                  <th>Repository</th><th>Runner</th><th>Uses</th><th>Retry</th>
                  <th>Updated</th><th></th>
                </tr>
              </thead>
              <tbody>
                <template x-for="r in instances" :key="r.id">
                  <tr>
                    <td class="mono num" x-text="r.vmid"></td>
                    <td class="mono faint" x-text="r.ip_address"></td>
                    <td x-text="r.mode"></td>
                    <td>
                      <span class="status" :class="statusMeta(r.status).cls">
                        <span class="status__glyph" aria-hidden="true"
                              x-text="statusMeta(r.status).glyph"></span>
                        <span x-text="statusMeta(r.status).label"></span>
                      </span>
                    </td>
                    <td class="mono" x-text="r.repository ?? '—'"></td>
                    <td class="mono faint" x-text="r.runner_name ?? '—'"></td>
                    <td class="num" x-text="r.use_count ?? 0"></td>
                    <td class="num faint"
                        x-text="r.delete_attempts
                          ? `#${r.delete_attempts}` + (r.delete_not_before
                              ? ` in ${fmt.ageShort(r.delete_not_before - Math.floor(Date.now()/1000))}`
                              : '')
                          : '—'"></td>
                    <td class="num faint" x-text="relAge(r.updated_at) + ' ago'"></td>
                    <td>
                      <span class="row-actions">
                        <button class="btn btn--sm" @click="drawer = r">Inspect</button>
                        <button class="btn btn--sm btn--danger" :disabled="!canChange"
                                :title="lockReason" @click="destroyInstance(r, false)">Destroy</button>
                      </span>
                    </td>
                  </tr>
                </template>
                <template x-if="!instances.length">
                  <tr><td colspan="10">
                    <div class="empty">
                      <span class="empty__glyph" aria-hidden="true">○</span>
                      <p>No runners match these filters.</p>
                      <button class="btn btn--sm"
                              @click="filters = {repository:'',status:'',mode:'',q:''}">Clear filters</button>
                    </div>
                  </td></tr>
                </template>
              </tbody>
            </table>
          </div>
        </section>

        <template x-if="overview.pending_deregistrations">
          <section class="panel">
            <header class="panel__head">
              <h2 class="panel__title">Deferred GitHub deregistrations</h2>
              <span class="panel__meta"
                    x-text="overview.pending_deregistrations + ' queued'"></span>
            </header>
            <div class="panel__body">
              <p class="meter__note">
                These containers were destroyed locally because GitHub was unreachable.
                Their runner registrations are queued and purge automatically once the
                circuit closes — no container is held hostage by the outage.
              </p>
            </div>
          </section>
        </template>
      </div>
    </template>

    <!-- ═════════════════════════════════════════════════════════════ JOBS ══ -->
    <template x-if="snap && !needsSetup && route === 'jobs'">
      <div class="page">
        <section class="panel">
          <header class="panel__head">
            <h2 class="panel__title">Job timeline</h2>
            <span class="panel__meta">widths are proportional to total wall time</span>
          </header>
          <div class="panel__body">
            <div class="timeline">
              <template x-for="row in timelineRows(16)" :key="row.job.job_id">
                <div class="tl-row">
                  <span class="tl-label"><span class="mono" x-text="row.job.repository"></span></span>
                  <div class="tl-rail" :style="`width:${row.width}%`">
                    <template x-for="(s, i) in row.segs" :key="i">
                      <div class="tl-seg" :class="'p-' + s.phase" :style="`width:${s.pct}%`"
                           :title="`${s.phase}: ${s.seconds}s`"></div>
                    </template>
                  </div>
                  <span class="tl-dur" x-text="row.total + 's'"></span>
                </div>
              </template>
            </div>
          </div>
        </section>

        <section class="panel">
          <header class="panel__head"><h2 class="panel__title">Recent jobs</h2></header>
          <div class="table-wrap">
            <table class="table">
              <thead><tr>
                <th>Job</th><th>Repository</th><th>Mode</th><th>Start</th><th>Status</th>
                <th>Runner</th><th>Attempts</th><th>Duration</th><th>Error</th><th>Created</th>
              </tr></thead>
              <tbody>
                <template x-for="j in jobs" :key="j.job_id">
                  <tr>
                    <td>
                      <template x-if="j.github_job_url">
                        <a class="mono" :href="j.github_job_url" target="_blank" rel="noopener"
                           x-text="j.job_id"></a>
                      </template>
                      <template x-if="!j.github_job_url">
                        <span class="mono" x-text="j.job_id"></span>
                      </template>
                    </td>
                    <td class="mono" x-text="j.repository"></td>
                    <td x-text="j.mode ?? '—'"></td>
                    <td>
                      <template x-if="j.start_source">
                        <span class="tag" :title="'runner source: ' + j.start_source">
                          <span class="tag__dot" :class="'is-' + j.start_source"></span>
                          <span x-text="j.start_source"></span>
                        </span>
                      </template>
                      <template x-if="!j.start_source"><span class="faint">—</span></template>
                    </td>
                    <td>
                      <span class="status" :class="statusMeta(j.status).cls">
                        <span class="status__glyph" aria-hidden="true"
                              x-text="statusMeta(j.status).glyph"></span>
                        <span x-text="statusMeta(j.status).label"></span>
                      </span>
                    </td>
                    <td class="mono faint" x-text="j.runner_name ?? '—'"></td>
                    <td class="num" x-text="j.attempts"></td>
                    <td class="num" x-text="(j.duration_seconds ?? 0) + 's'"></td>
                    <td class="faint" x-text="j.error ?? '—'"></td>
                    <td class="num faint" x-text="relAge(j.created_at) + ' ago'"></td>
                  </tr>
                </template>
                <template x-if="!jobs.length">
                  <tr><td colspan="10">
                    <div class="empty"><span class="empty__glyph">○</span><p>No jobs yet.</p></div>
                  </td></tr>
                </template>
              </tbody>
            </table>
          </div>
        </section>
      </div>
    </template>

    <!-- ═════════════════════════════════════════════════════════ WEBHOOKS ══ -->
    <template x-if="snap && !needsSetup && route === 'webhooks'">
      <div class="page">
        <section class="panel">
          <header class="panel__head">
            <h2 class="panel__title">Webhook deliveries</h2>
            <span class="panel__meta">POST /webhooks/github · HMAC-verified</span>
          </header>
          <div class="table-wrap">
            <table class="table">
              <thead><tr>
                <th>Received</th><th>Event</th><th>Action</th><th>Result</th>
                <th>Reason</th><th>Delivery</th>
              </tr></thead>
              <tbody>
                <template x-for="d in (snap.deliveries ?? [])" :key="d.delivery_id">
                  <tr>
                    <td class="num faint" x-text="relAge(d.received_at) + ' ago'"></td>
                    <td class="mono" x-text="d.event"></td>
                    <td x-text="d.action ?? '—'"></td>
                    <td>
                      <span class="status" :class="d.accepted ? 's-ready' : 's-idle'">
                        <span class="status__glyph" aria-hidden="true"
                              x-text="d.accepted ? '●' : '○'"></span>
                        <span x-text="d.accepted ? 'accepted' : 'ignored'"></span>
                      </span>
                    </td>
                    <td class="mono faint" x-text="d.reason"></td>
                    <td class="mono faint" x-text="String(d.delivery_id).slice(0, 18) + '…'"></td>
                  </tr>
                </template>
                <template x-if="!(snap.deliveries ?? []).length">
                  <tr><td colspan="6">
                    <div class="empty"><span class="empty__glyph">○</span><p>No deliveries yet.</p></div>
                  </td></tr>
                </template>
              </tbody>
            </table>
          </div>
        </section>
      </div>
    </template>

    <!-- ═════════════════════════════════════════════════════════ CAPACITY ══ -->
    <template x-if="snap && !needsSetup && route === 'capacity'">
      <div class="page">
        <section class="panel">
          <header class="panel__head">
            <h2 class="panel__title"
                x-text="`Thin pool — ${storage.storage ?? '?'} on ${storage.node ?? '?'}`"></h2>
            <span class="panel__meta"
                  x-text="storage.admits === false ? 'admission BLOCKED' : 'admission open'"></span>
          </header>
          <div class="panel__body">
            <template x-if="gauge">
              <div class="gauge">
                <p class="gauge__head">
                  <span class="gauge__pct" x-text="fmt.pct(storage.used_ratio)"></span>
                  <span class="gauge__bytes"
                        x-text="`${fmt.gib(storage.used_bytes)} used of ${fmt.gib(storage.total_bytes)} · ${fmt.gib(gauge.free)} free`"></span>
                </p>
                <div class="gauge__track">
                  <div class="gauge__seg is-runners" :class="{ 'is-bad': gauge.critical }"
                       :style="`left:0;width:${gauge.usedPct}%`"></div>
                  <div class="gauge__floor" data-label="admission floor"
                       :style="`left:${gauge.floorPct}%`"></div>
                </div>
                <p class="meter__note" x-text="storage.reason"></p>
              </div>
            </template>
            <template x-if="!gauge">
              <div class="empty">
                <span class="empty__glyph" aria-hidden="true">○</span>
                <p>Storage reading unavailable — the guard is failing open.</p>
              </div>
            </template>
          </div>
        </section>

        <div class="grid-3">
          <section class="panel">
            <header class="panel__head"><h2 class="panel__title">Projected demand</h2></header>
            <div class="panel__body">
              <p class="meter__value" x-text="fmt.gib(storage.projected_demand_bytes)"></p>
              <p class="meter__note" style="margin-top:var(--s-2)">
                <span class="mono" x-text="cap.max_active"></span> max_active × the
                configured rootfs size. This is what the current configuration is allowed
                to consume — the check that did not exist during the incident.
              </p>
              <template x-if="gauge">
                <div>
                  <div class="meter__track" style="margin-top:var(--s-3)">
                    <div class="meter__fill"
                         :class="gauge.projectedPct > 40 ? 'is-warn' : 'is-ok'"
                         :style="`width:${Math.min(100, gauge.projectedPct)}%`"></div>
                  </div>
                  <p class="meter__note"
                     x-text="gauge.projectedPct.toFixed(1) + '% of the pool'"></p>
                </div>
              </template>
            </div>
          </section>

          <section class="panel">
            <header class="panel__head"><h2 class="panel__title">Admission</h2></header>
            <div class="panel__body">
              <dl class="kv">
                <dt>Replenish</dt>
                <dd x-text="storage.admits === false ? 'blocked' : 'allowed'"></dd>
                <dt>New jobs</dt>
                <dd x-text="storage.admits === false
                            ? 'requeued as storage_exhausted' : 'allowed'"></dd>
                <dt>Floor</dt>
                <dd class="mono"
                    x-text="`${fmt.pct(storage.floor_ratio, 0)} used / ${storage.min_free_gb} GiB free`"></dd>
              </dl>
              <p class="meter__note" style="margin-top:var(--s-3)">
                Speculative capacity is refused hard. Real queued jobs are requeued,
                never failed — waiting is recoverable, a burnt attempt is not.
              </p>
            </div>
          </section>

          <section class="panel">
            <header class="panel__head"><h2 class="panel__title">Fleet</h2></header>
            <div class="panel__body">
              <dl class="kv">
                <dt>VMID range</dt>
                <dd class="mono" x-text="(overview.proxmox?.vmid_range ?? []).join('–')"></dd>
                <dt>In use</dt>
                <dd class="mono num" x-text="(snap.instances ?? []).length"></dd>
                <dt>Template</dt>
                <dd class="mono" x-text="overview.proxmox?.template_vmid ?? '—'"></dd>
                <dt>Node</dt>
                <dd class="mono" x-text="overview.proxmox?.node ?? '—'"></dd>
              </dl>
            </div>
          </section>
        </div>
      </div>
    </template>

    <!-- ═════════════════════════════════════════════════════ DEPENDENCIES ══ -->
    <template x-if="snap && !needsSetup && route === 'dependencies'">
      <div class="page">
        <div class="grid-2">
          <template x-for="d in deps" :key="d.name">
            <section class="panel">
              <header class="panel__head">
                <span class="dep__dot"
                  :class="d.unknown ? 'is-warn' : (d.up ? 'is-up' : 'is-down')"></span>
                <h2 class="panel__title" x-text="d.label"></h2>
                <span class="panel__meta mono" x-text="d.detail"></span>
              </header>
              <div class="panel__body">
                <dl class="kv">
                  <template x-if="d.failures">
                    <dt>Consecutive failures</dt>
                  </template>
                  <template x-if="d.failures">
                    <dd class="num" x-text="d.failures"></dd>
                  </template>
                  <template x-if="d.openFor">
                    <dt>Circuit open for</dt>
                  </template>
                  <template x-if="d.openFor">
                    <dd x-text="fmt.age(d.openFor)"></dd>
                  </template>
                </dl>
                <template x-if="d.error">
                  <p class="well" style="margin-top:var(--s-3)" x-text="d.error"></p>
                </template>
                <template x-if="!d.error && d.up && !d.unknown">
                  <p class="meter__note">Healthy.</p>
                </template>
              </div>
            </section>
          </template>
        </div>

      </div>
    </template>

    <!-- ════════════════════════════════════════════════════════════ DRIFT ══ -->
    <template x-if="snap && !needsSetup && route === 'drift'">
      <div class="page">
        <section class="panel">
          <header class="panel__head">
            <h2 class="panel__title">Database ↔ Proxmox drift</h2>
            <button class="btn btn--sm" style="margin-left:auto"
                    :class="{ 'is-busy': driftLoading }" @click="loadDrift()">Scan</button>
          </header>
          <div class="panel__body">
            <p class="meter__note">
              A dry-run comparison of what the database believes against what actually
              exists on the node. Nothing changes until you select rows and apply — and
              apply is rejected if the set changed since this scan.
            </p>
          </div>

          <template x-if="!drift">
            <div class="empty">
              <span class="empty__glyph" aria-hidden="true">○</span>
              <p>Run a scan to compare the database against the hypervisor.</p>
            </div>
          </template>

          <template x-if="drift && !driftItems().length">
            <div class="empty">
              <span class="empty__glyph" aria-hidden="true">●</span>
              <p>No drift. Every row has a container, and every managed container has a row.</p>
            </div>
          </template>

          <template x-if="drift && driftItems().length">
            <div>
              <div class="table-wrap">
                <table class="table">
                  <thead><tr>
                    <th></th><th>Kind</th><th>VMID</th><th>Detail</th><th>Age</th>
                    <th>Proposed action</th>
                  </tr></thead>
                  <tbody>
                    <template x-for="item in driftItems()" :key="item.kind + item.vmid">
                      <tr>
                        <td>
                          <input type="checkbox" :checked="driftSelection.includes(item.vmid)"
                                 @change="toggleDrift(item.vmid)"
                                 :aria-label="'Select ' + item.vmid">
                        </td>
                        <td x-text="{row:'row without container',
                                     container:'container without row',
                                     stuck:'stuck in deleting'}[item.kind]"></td>
                        <td class="mono num" x-text="item.vmid"></td>
                        <td class="mono faint"
                            x-text="item.runner_name ?? item.name ?? item.mode ?? '—'"></td>
                        <td class="num faint" x-text="fmt.age(item.age_seconds)"></td>
                        <td class="faint" x-text="{row:'delete row, queue deregistration',
                                                   container:'destroy container on the node',
                                                   stuck:'return to delete_pending'}[item.kind]"></td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>
              <div class="table-toolbar"
                   style="border-bottom:none;border-top:1px solid var(--hairline)">
                <span class="faint"
                      x-text="driftSelection.length + ' of ' + driftItems().length + ' selected'"></span>
                <div style="flex:1"></div>
                <button class="btn btn--sm" @click="driftSelection = []">Clear</button>
                <button class="btn btn--danger" :disabled="!driftSelection.length || !canChange"
                        :title="lockReason" @click="applyDrift()">Apply repair</button>
              </div>
            </div>
          </template>
        </section>
      </div>
    </template>

    <!-- ═════════════════════════════════════════════════════════════ LOGS ══ -->
    <template x-if="snap && !needsSetup && route === 'logs'">
      <div class="page">
        <section class="panel">
          <div class="table-toolbar">
            <div class="field">
              <label class="field__label" for="l-level">Level</label>
              <select id="l-level" class="select" x-model="logFilters.level">
                <option value="all">all</option>
                <option value="warn">warn+</option>
                <option value="error">error</option>
              </select>
            </div>
            <div class="field">
              <label class="field__label" for="l-cat">Category</label>
              <select id="l-cat" class="select" x-model="logFilters.category">
                <option value="all">all</option>
                <template x-for="c in logCategories" :key="c">
                  <option :value="c" x-text="c"></option>
                </template>
              </select>
            </div>
            <div style="flex:1"></div>
            <span class="faint" x-text="logs.length + ' event(s) · ring buffer'"></span>
          </div>

          <div class="logs">
            <template x-for="l in logs" :key="l.id">
              <div class="log"
                   :class="{ 'l-error-row': l.level === 'error', 'has-detail': l.detail }"
                   @click="l.detail && (openLog = openLog === l.id ? null : l.id)"
                   :aria-expanded="l.detail ? (openLog === l.id) : undefined">
                <span class="log__ts" x-text="fmt.time(l.ts)"></span>
                <span class="log__lvl" :class="'l-' + l.level"
                      x-text="String(l.level).toUpperCase()"></span>
                <span class="log__cat" x-text="l.category"></span>
                <span class="log__msg">
                  <span x-text="l.message"></span>
                  <span class="log__ctx">
                    <template x-for="[k, v] in Object.entries(l.context ?? {})" :key="k">
                      <span x-text="`${k}=${v}`"></span>
                    </template>
                  </span>
                </span>
                <template x-if="l.detail && openLog === l.id">
                  <pre class="log__detail" x-text="l.detail"></pre>
                </template>
              </div>
            </template>
            <template x-if="!logs.length">
              <div class="empty">
                <span class="empty__glyph" aria-hidden="true">○</span>
                <p>No events match these filters.</p>
              </div>
            </template>
          </div>
        </section>
      </div>
    </template>

    <!-- ════════════════════════════════════════════════════════════ CACHE ══ -->
    <template x-if="snap && !needsSetup && route === 'cache'">
      <div class="page">
        <section class="panel">
          <header class="panel__head">
            <h2 class="panel__title">Build cache</h2>
            <button class="btn btn--sm" style="margin-left:auto"
                    :class="{ 'is-busy': cacheLoading }" @click="loadCache()">Refresh</button>
          </header>
          <template x-if="!cache">
            <div class="empty">
              <span class="empty__glyph" aria-hidden="true">○</span>
              <p>Cache inventory loads from the broker on demand.</p>
            </div>
          </template>
          <template x-if="cache">
            <div class="table-wrap">
              <table class="table">
                <thead><tr>
                  <th>Repository</th><th>Size</th><th>Modified</th><th>Status</th><th></th>
                </tr></thead>
                <tbody>
                  <template x-for="c in (cache.repositories ?? cache.caches ?? [])"
                            :key="c.repository">
                    <tr>
                      <td class="mono" x-text="c.repository"></td>
                      <td class="num" x-text="fmt.bytes(c.size_bytes ?? c.bytes ?? 0)"></td>
                      <td class="num faint"
                          x-text="c.modified ? fmt.dateTime(c.modified) : '—'"></td>
                      <td>
                        <span class="status s-ready">
                          <span class="status__glyph">●</span>
                          <span x-text="c.status ?? 'present'"></span>
                        </span>
                      </td>
                      <td>
                        <span class="row-actions">
                          <button class="btn btn--sm btn--danger" :disabled="!canChange"
                                  :title="lockReason" @click="purgeCache(c.repository)">Purge</button>
                        </span>
                      </td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </template>
        </section>
      </div>
    </template>

    <!-- ═════════════════════════════════════════════════════════ POLICIES ══ -->
    <template x-if="snap && !needsSetup && route === 'policies'">
      <div class="page" data-policies>
        <section class="panel">
          <header class="panel__head">
            <h2 class="panel__title">Policies</h2>
            <span class="panel__meta" :class="{ warn: $store.policies.statusKind === 'bad' }"
                  x-text="$store.policies.statusText"></span>
          </header>
          <div class="table-toolbar">
            <button class="btn" @click="$store.policies.addInstallation()">Add installation</button>
            <button class="btn" @click="$store.policies.addRepository()">Add repository</button>
            <div style="flex:1"></div>
            <button class="btn btn--ghost" @click="$store.policies.reset()">Reset</button>
            <button class="btn btn--primary" :disabled="$store.policies.saving || !canChange"
                    :class="{ 'is-busy': $store.policies.saving }" :title="lockReason"
                    @click="$store.policies.save()">Save policies</button>
          </div>
          <div class="panel__body">
            <p class="meter__note" x-text="$store.policies.meta.broker_note"></p>
          </div>
        </section>

        <section class="panel">
          <header class="panel__head">
            <h2 class="panel__title">Global capacity</h2>
            <span class="panel__meta mono" :class="{ warn: $store.policies.warmBudgetOver }"
                  x-text="$store.policies.warmBudgetHint"></span>
          </header>
          <div class="panel__body">
            <div class="grid-3">
              <div class="field">
                <label class="field__label" for="p-max-active">Max active (global)</label>
                <input id="p-max-active" class="input" type="number" min="1"
                       x-model.number="$store.policies.capacity.max_active">
              </div>
              <div class="field">
                <label class="field__label" for="p-pool-size">Pool size (global)</label>
                <input id="p-pool-size" class="input" type="number" min="0"
                       x-model.number="$store.policies.capacity.pool_size">
              </div>
              <div class="field">
                <label class="field__label">Projected disk</label>
                <p class="meter__value" style="font-size:var(--fs-lead)"
                   x-text="fmt.gib(storage.projected_demand_bytes)"></p>
                <p class="meter__note">raising max_active raises this</p>
              </div>
            </div>
          </div>
        </section>

        <section class="panel">
          <header class="panel__head"><h2 class="panel__title">GitHub installations</h2></header>
          <div class="panel__body" style="display:flex;flex-direction:column;gap:var(--s-4)">
            <template x-for="inst in $store.policies.installations" :key="inst._id">
              <div style="border:1px solid var(--hairline);border-radius:var(--r-control);padding:var(--s-3)">
                <div class="grid-3">
                  <div class="field">
                    <label class="field__label">Key</label>
                    <input class="input" x-model="inst.key">
                  </div>
                  <div class="field">
                    <label class="field__label">Account (handle/org)</label>
                    <input class="input" x-model="inst.account">
                  </div>
                  <div class="field">
                    <label class="field__label">Installation ID</label>
                    <input class="input" type="number" x-model.number="inst.installation_id">
                  </div>
                  <div class="field">
                    <label class="field__label">Scope</label>
                    <select class="select" x-model="inst.scope">
                      <option value="repository">repository</option>
                      <option value="organization">organization</option>
                    </select>
                  </div>
                  <div class="field">
                    <label class="field__label">Runner group ID</label>
                    <input class="input" type="number" x-model.number="inst.runner_group_id">
                  </div>
                  <div class="field" style="justify-content:flex-end">
                    <button class="btn btn--danger btn--sm"
                            @click="$store.policies.removeInstallation(inst._id)">Remove</button>
                  </div>
                </div>
              </div>
            </template>
            <template x-if="!$store.policies.installations.length">
              <p class="meter__note">No installations yet. Click <strong>Add installation</strong>.</p>
            </template>
          </div>
        </section>

        <section class="panel">
          <header class="panel__head"><h2 class="panel__title">Repository policies</h2></header>
          <div class="panel__body" style="display:flex;flex-direction:column;gap:var(--s-4)">
            <template x-for="policy in $store.policies.repositories" :key="policy._id">
              <div style="border:1px solid var(--hairline);border-radius:var(--r-control);padding:var(--s-3)">
                <div class="grid-3">
                  <div class="field">
                    <label class="field__label">Repository</label>
                    <input class="input" x-model="policy.repository">
                  </div>
                  <div class="field">
                    <label class="field__label">Installation</label>
                    <select class="select" x-model="policy.github_installation">
                      <template x-for="name in $store.policies.installationNames" :key="name">
                        <option :value="name" x-text="name"></option>
                      </template>
                    </select>
                  </div>
                  <div class="field">
                    <label class="field__label">Default mode</label>
                    <select class="select" x-model="policy.default_mode">
                      <template x-for="m in $store.policies.meta.mode_options" :key="m">
                        <option :value="m" x-text="m"></option>
                      </template>
                    </select>
                  </div>
                  <div class="field">
                    <label class="field__label">Profile</label>
                    <select class="select" x-model="policy.profile">
                      <template x-for="name in $store.policies.profileNames" :key="name">
                        <option :value="name"
                                x-text="$store.policies.profileLabel(name)"></option>
                      </template>
                    </select>
                  </div>
                  <div class="field">
                    <label class="field__label">Warm capacity</label>
                    <input class="input" type="number" min="0"
                           x-model.number="policy.warm_capacity">
                  </div>
                  <div class="field">
                    <label class="field__label">Max concurrent (0 = unlimited)</label>
                    <input class="input" type="number" min="0"
                           x-model.number="policy.max_concurrent">
                  </div>
                  <div class="field">
                    <label class="field__label">Warm idle floor (-1 = disabled)</label>
                    <input class="input" type="number" min="-1" :max="policy.warm_capacity"
                           x-model.number="policy.warm_idle_capacity">
                  </div>
                  <div class="field">
                    <label class="field__label">Warm idle after (minutes)</label>
                    <input class="input" type="number" min="0"
                           x-model.number="policy.warm_idle_after_minutes">
                  </div>
                  <div class="field" style="justify-content:flex-end">
                    <button class="btn btn--danger btn--sm"
                            @click="$store.policies.removeRepository(policy._id)">Remove</button>
                  </div>
                </div>

                <template x-for="group in [
                    {key:'allowed_modes',   label:'Allowed modes',   options:$store.policies.meta.mode_options},
                    {key:'allowed_events',  label:'Allowed events',  options:$store.policies.meta.event_options},
                    {key:'required_labels', label:'Required labels', options:$store.policies.meta.label_options}
                  ]" :key="group.key">
                  <div style="margin-top:var(--s-3)">
                    <p class="eyebrow" x-text="group.label"></p>
                    <div style="display:flex;flex-wrap:wrap;gap:var(--s-3);margin-top:var(--s-1)">
                      <template x-for="option in group.options" :key="option">
                        <label class="check">
                          <input type="checkbox" :value="option" x-model="policy[group.key]">
                          <span x-text="option"></span>
                        </label>
                      </template>
                    </div>
                  </div>
                </template>
              </div>
            </template>
          </div>
        </section>
      </div>
    </template>

  </main>

  <!-- ═══════════════════════════════════════════════════════════ drawer ══ -->
  <template x-if="drawer">
    <div>
      <div class="scrim" @click="drawer = null"></div>
      <aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
        <header class="drawer__head">
          <h2 class="panel__title" id="drawer-title">
            <span class="mono" x-text="'CT ' + drawer.vmid"></span>
          </h2>
          <span class="status" :class="statusMeta(drawer.status).cls">
            <span class="status__glyph" aria-hidden="true"
                  x-text="statusMeta(drawer.status).glyph"></span>
            <span x-text="statusMeta(drawer.status).label"></span>
          </span>
          <button class="btn btn--ghost" style="margin-left:auto" @click="drawer = null"
                  aria-label="Close">✕</button>
        </header>
        <div class="drawer__body">
          <dl class="kv">
            <dt>Address</dt><dd class="mono" x-text="drawer.ip_address"></dd>
            <dt>Mode</dt><dd x-text="drawer.mode"></dd>
            <dt>Repository</dt><dd class="mono" x-text="drawer.repository ?? '—'"></dd>
            <dt>Runner name</dt><dd class="mono" x-text="drawer.runner_name ?? '—'"></dd>
            <dt>Uses</dt><dd class="num" x-text="drawer.use_count ?? 0"></dd>
            <dt>Created</dt><dd x-text="relAge(drawer.created_at) + ' ago'"></dd>
            <dt>Last update</dt><dd x-text="relAge(drawer.updated_at) + ' ago'"></dd>
            <template x-if="drawer.delete_attempts">
              <dt>Delete attempts</dt>
            </template>
            <template x-if="drawer.delete_attempts">
              <dd class="num" x-text="drawer.delete_attempts"></dd>
            </template>
          </dl>
          <template x-if="drawer.error">
            <div>
              <p class="eyebrow" style="margin-bottom:var(--s-2)">Error</p>
              <p class="well" x-text="drawer.error"></p>
            </div>
          </template>
          <template x-if="drawer.github_job_url">
            <p><a :href="drawer.github_job_url" target="_blank" rel="noopener">Open job on GitHub →</a></p>
          </template>
        </div>
        <footer class="drawer__foot">
          <button class="btn btn--danger" :disabled="!canChange" :title="lockReason"
                  @click="destroyInstance(drawer, false)">Destroy</button>
          <button class="btn btn--danger" :disabled="!canChange" :title="lockReason"
                  @click="destroyInstance(drawer, true)">Force destroy</button>
          <div style="flex:1"></div>
          <button class="btn" @click="drawer = null">Close</button>
        </footer>
      </aside>
    </div>
  </template>

  <!-- ═══════════════════════════════════════════════════════════ confirm ══ -->
  <template x-if="confirmBox">
    <div class="modal">
      <div class="scrim" @click="resolveConfirm(false)"></div>
      <div class="modal__card" :class="{ 'is-danger': confirmBox.kind === 'danger' }"
           role="alertdialog" aria-modal="true" aria-labelledby="confirm-title">
        <header class="modal__head">
          <h2 class="panel__title" id="confirm-title" x-text="confirmBox.title"></h2>
        </header>
        <div class="modal__body" x-text="confirmBox.body"></div>
        <footer class="modal__foot">
          <button class="btn" @click="resolveConfirm(false)"
                  x-text="confirmBox.cancelLabel || 'Cancel'"></button>
          <button class="btn"
                  :class="confirmBox.kind === 'danger' ? 'btn--danger' : 'btn--primary'"
                  @click="resolveConfirm(true)"
                  x-text="confirmBox.label || confirmBox.confirmLabel || 'Confirm'"
                  x-init="$nextTick(() => $el.focus())"></button>
        </footer>
      </div>
    </div>
  </template>

  <!-- ════════════════════════════════════════════════════════════ unlock ══ -->
  <template x-if="unlockForm.open">
    <div class="modal">
      <div class="scrim" @click="unlockForm.open = false"></div>
      <div class="modal__card" role="dialog" aria-modal="true" aria-labelledby="unlock-title">
        <header class="modal__head">
          <h2 class="panel__title" id="unlock-title">Unlock to make changes</h2>
        </header>
        <form class="modal__body" @submit.prevent="submitUnlock()">
          <p class="meter__note" style="margin-bottom:var(--s-3)">
            Drain, policy changes and container destroy are locked. Enter the
            admin password for this orchestrator to enable them.
          </p>
          <div class="field">
            <label class="field__label" for="unlock-password">Admin password</label>
            <input id="unlock-password" class="input" type="password"
                   autocomplete="current-password" x-model="unlockForm.password">
          </div>
          <label class="check" style="margin-top:var(--s-3)">
            <input type="checkbox" x-model="unlockForm.remember">
            <span>Stay unlocked on this device</span>
          </label>
          <p class="meter__note" style="margin-top:var(--s-1)"
             x-text="unlockForm.remember
               ? 'Stays unlocked until you lock it again. Use only on a machine you trust.'
               : 'Locks again when you close this tab.'"></p>
          <template x-if="unlockForm.error">
            <p class="well" style="margin-top:var(--s-3);color:var(--bad)" x-text="unlockForm.error"></p>
          </template>
          <div class="modal__foot" style="padding-inline:0;padding-bottom:0;border:none">
            <button class="btn" type="button" @click="unlockForm.open = false">Cancel</button>
            <button class="btn btn--primary" type="submit"
                    :class="{ 'is-busy': unlockForm.busy }"
                    :disabled="!unlockForm.password || unlockForm.busy">
              Unlock
            </button>
          </div>
        </form>
      </div>
    </div>
  </template>

  <!-- ══════════════════════════════════════════════════ change password ══ -->
  <template x-if="passwordForm.open">
    <div class="modal">
      <div class="scrim" @click="passwordForm.open = false"></div>
      <div class="modal__card" role="dialog" aria-modal="true" aria-labelledby="pw-title">
        <header class="modal__head">
          <h2 class="panel__title" id="pw-title">Change admin password</h2>
        </header>
        <form class="modal__body" @submit.prevent="submitPasswordChange()">
          <div class="field">
            <label class="field__label" for="pw-current">Current password</label>
            <input id="pw-current" class="input" type="password"
                   autocomplete="current-password" x-model="passwordForm.current">
          </div>
          <div class="field" style="margin-top:var(--s-3)">
            <label class="field__label" for="pw-next">New password</label>
            <input id="pw-next" class="input" type="password" minlength="12"
                   autocomplete="new-password" x-model="passwordForm.next"
                   placeholder="at least 12 characters">
          </div>
          <div class="field" style="margin-top:var(--s-3)">
            <label class="field__label" for="pw-confirm">Confirm new password</label>
            <input id="pw-confirm" class="input" type="password"
                   autocomplete="new-password" x-model="passwordForm.confirm">
          </div>
          <p class="meter__note" style="margin-top:var(--s-2);color:var(--warn)"
             x-show="passwordForm.confirm && passwordForm.next !== passwordForm.confirm">
            The two new entries do not match.
          </p>
          <template x-if="passwordForm.error">
            <p class="well" style="margin-top:var(--s-3);color:var(--bad)"
               x-text="passwordForm.error"></p>
          </template>
          <div class="modal__foot" style="padding-inline:0;padding-bottom:0;border:none">
            <button class="btn" type="button" @click="passwordForm.open = false">Cancel</button>
            <button class="btn btn--primary" type="submit" :class="{ 'is-busy': passwordForm.busy }"
                    :disabled="passwordForm.busy || passwordForm.next.length < 12
                               || passwordForm.next !== passwordForm.confirm">
              Change password
            </button>
          </div>
        </form>
      </div>
    </div>
  </template>

  <!-- ═══════════════════════════════════════════════════════════ palette ══ -->
  <template x-if="palette.open">
    <div class="palette">
      <div class="scrim" @click="palette.open = false"></div>
      <div class="palette__card" role="dialog" aria-modal="true" aria-label="Command palette">
        <input id="palette-input" class="palette__input" type="text"
               placeholder="Type a command…" x-model="palette.query"
               @input="palette.index = 0" autocomplete="off">
        <div class="palette__list" role="listbox">
          <template x-for="(item, i) in paletteItems" :key="item.label">
            <button class="palette__item" role="option" :aria-selected="i === palette.index"
                    @mouseenter="palette.index = i" @click="runPaletteItem(i)">
              <span x-text="item.label"></span>
              <span class="palette__hint" x-text="item.hint"></span>
            </button>
          </template>
        </div>
      </div>
    </div>
  </template>

  <!-- ════════════════════════════════════════════════════════════ toasts ══ -->
  <div class="toasts" aria-live="polite">
    <template x-for="t in toasts" :key="t.id">
      <div class="toast" :class="t.kind ? 'is-' + t.kind : ''">
        <div>
          <p class="toast__title" x-text="t.title"></p>
          <template x-if="t.body">
            <p class="toast__body" x-text="t.body"></p>
          </template>
        </div>
      </div>
    </template>
  </div>

</div>

<script src="js/app.js"></script>
<script defer src="vendor/alpinejs-3.15.12.min.js"></script>
</body>
</html>

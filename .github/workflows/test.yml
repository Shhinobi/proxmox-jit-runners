name: test

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: arc-k3s-light
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      - run: uv sync --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy orchestrator

  test:
    runs-on: arc-k3s-medium
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      - run: uv sync --dev
      - run: uv run pytest --cov=orchestrator --cov-report=term-missing

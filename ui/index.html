<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Runner Orchestrator</title>
  <link rel="stylesheet" href="/ui/styles.css" />
</head>
<body>
  <header class="top">
    <div>
      <h1>Runner Orchestrator</h1>
      <p class="sub">Proxmox JIT · live dashboard</p>
    </div>
    <div class="header-right">
      <div class="admin" id="admin">
        <button type="button" id="btn-drain" class="btn warn">Drain</button>
        <button type="button" id="btn-resume" class="btn ok">Resume</button>
        <button type="button" id="btn-reconcile" class="btn">Reconcile</button>
        <button type="button" id="btn-recycle-ready" class="btn warn">Recycle ready</button>
      </div>
      <div class="badges" id="badges"></div>
    </div>
  </header>

  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <div id="confirm-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-body">
    <div class="modal-backdrop" data-confirm-dismiss></div>
    <div class="modal-card">
      <div class="modal-accent" id="confirm-accent"></div>
      <div class="modal-content">
        <div class="modal-kicker" id="confirm-kicker">Confirmar</div>
        <h3 class="modal-title" id="confirm-title">Confirmar ação</h3>
        <p class="modal-body" id="confirm-body"></p>
        <div class="modal-actions">
          <button type="button" class="btn ghost" id="confirm-cancel" data-confirm-dismiss>Cancelar</button>
          <button type="button" class="btn" id="confirm-ok">Confirmar</button>
        </div>
      </div>
    </div>
  </div>

  <section class="alerts" id="alerts"></section>
  <section class="cards" id="cards"></section>

  <section class="filters panel-box">
    <label>Repository
      <input id="filter-repo" type="text" placeholder="owner/repo" list="repo-list" />
      <datalist id="repo-list"></datalist>
    </label>
    <label>Status
      <select id="filter-status">
        <option value="">any</option>
        <option>queued</option>
        <option>provisioning</option>
        <option>waiting_for_runner</option>
        <option>running</option>
        <option>completed</option>
        <option>failed</option>
        <option>rejected</option>
      </select>
    </label>
    <label>Mode
      <select id="filter-mode">
        <option value="">any</option>
        <option>ephemeral</option>
        <option>pool</option>
        <option>warm</option>
        <option>persistent</option>
      </select>
    </label>
    <button type="button" id="btn-apply-filters" class="btn">Apply filters</button>
    <button type="button" id="btn-clear-filters" class="btn ghost">Clear</button>
  </section>

  <section class="panel-box chart-box">
    <div class="chart-head">
      <h2>Job duration (recent completed)</h2>
      <div class="metrics-line" id="metrics-line"></div>
    </div>
    <canvas id="duration-chart" width="960" height="160" aria-label="Job durations chart"></canvas>
  </section>

  <nav class="tabs" role="tablist">
    <button type="button" class="tab active" data-tab="instances">Instances</button>
    <button type="button" class="tab" data-tab="jobs">Jobs</button>
    <button type="button" class="tab" data-tab="deliveries">Webhooks</button>
    <button type="button" class="tab" data-tab="logs">Logs</button>
    <button type="button" class="tab" data-tab="policies">Policies</button>
  </nav>

  <main>
    <section id="panel-instances" class="panel active">
      <div class="table-wrap"><table id="table-instances"></table></div>
    </section>
    <section id="panel-jobs" class="panel">
      <div class="table-wrap"><table id="table-jobs"></table></div>
    </section>
    <section id="panel-deliveries" class="panel">
      <div class="table-wrap"><table id="table-deliveries"></table></div>
    </section>
    <section id="panel-logs" class="panel">
      <div class="logs-toolbar">
        <label>Level
          <select id="log-filter-level">
            <option value="">all</option>
            <option value="error">error</option>
            <option value="warn">warn+</option>
            <option value="info">info</option>
          </select>
        </label>
        <label>Category
          <select id="log-filter-category">
            <option value="">all</option>
            <option value="warm">warm</option>
            <option value="job">job</option>
            <option value="destroy">destroy</option>
            <option value="reconcile">reconcile</option>
            <option value="system">system</option>
            <option value="admin">admin</option>
          </select>
        </label>
        <label class="inline-check">
          <input type="checkbox" id="log-auto-scroll" checked />
          Follow
        </label>
        <button type="button" id="btn-log-clear-filters" class="btn ghost">Clear filters</button>
        <span class="logs-meta muted" id="logs-meta"></span>
      </div>
      <div class="logs-wrap" id="logs-wrap">
        <div class="logs-empty muted" id="logs-empty">Aguardando eventos do orchestrator…</div>
        <div id="logs-list" class="logs-list"></div>
      </div>
    </section>
    <section id="panel-policies" class="panel">
      <div class="policy-toolbar">
        <button type="button" id="btn-policy-add" class="btn ok">Add repository</button>
        <button type="button" id="btn-policy-save" class="btn">Save policies</button>
        <button type="button" id="btn-policy-reset" class="btn ghost">Reset</button>
      </div>
      <p class="policy-note" id="policy-note"></p>
      <div id="policy-editor" class="policy-editor"></div>
    </section>
  </main>

  <footer>
    <span id="refresh-meta">connecting…</span>
    <span>SSE live · Authelia on public host · API <code>/api/v1/*</code></span>
  </footer>

  <script src="/ui/app.js"></script>
</body>
</html>
